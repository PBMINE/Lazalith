[package]
name = "lazalith-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "The lazen command-line toolchain"
license = "MIT OR Apache-2.0"

[[bin]]
name = "lazen"
path = "src/main.rs"

[dependencies]
lazalith-boot = { path = "../lazalith-boot" }
lazalith-manager = { path = "../lazalith-manager" }
lazalith-compiler = { path = "../lazalith-compiler" }
lazalith-cpu = { path = "../lazalith-cpu" }
lazalith-devices = { path = "../lazalith-devices" }
lazalith-driver = { path = "../lazalith-driver" }
lazalith-sysroot = { path = "../lazalith-sysroot" }
lazalith-isa = { path = "../lazalith-isa" }
lazalith-os = { path = "../lazalith-os" }
lazalith-runtime = { path = "../lazalith-runtime" }
lazalith-toolchain = { path = "../lazalith-toolchain" }
lazalith-types = { path = "../lazalith-types" }

[dev-dependencies]
lazalith-debug = { path = "../lazalith-debug" }
lazalith-os-abi = { path = "../lazalith-os-abi" }

[lints]
workspace = true
