[package]
name = "lazalith-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "The Lazalith runtime: the startup sequence and the Lazen library every program links"
license = "MIT OR Apache-2.0"

[dependencies]
lazalith-compiler = { path = "../lazalith-compiler" }
lazalith-codegen = { path = "../lazalith-codegen" }
lazalith-stdlib = { path = "../lazalith-stdlib" }
lazalith-ui = { path = "../lazalith-ui" }
lazalith-os = { path = "../lazalith-os" }
lazalith-toolchain = { path = "../lazalith-toolchain" }
lazalith-types = { path = "../lazalith-types" }

[lints]
workspace = true

[dev-dependencies]
lazalith-boot = { path = "../lazalith-boot" }
lazalith-cpu = { path = "../lazalith-cpu" }
lazalith-devices = { path = "../lazalith-devices" }
lazalith-isa = { path = "../lazalith-isa" }
lazalith-machine = { path = "../lazalith-machine" }
lazalith-memory = { path = "../lazalith-memory" }
