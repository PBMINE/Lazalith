[package]
name = "lazalith-c-compiler"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
lazalith-types = { path = "../lazalith-types" }
lazalith-diagnostics = { path = "../lazalith-diagnostics" }
lazalith-ir = { path = "../lazalith-ir" }
lazalith-os-abi = { path = "../lazalith-os-abi" }

[lints]
workspace = true

[dev-dependencies]
lazalith-boot = { path = "../lazalith-boot" }
lazalith-properties = { path = "../lazalith-properties" }
# Step 83: the three front ends have to converge on one object, and the test that
# says so has to build all three.
lazalith-compiler = { path = "../lazalith-compiler" }
lazalith-codegen = { path = "../lazalith-codegen" }
lazalith-cpu = { path = "../lazalith-cpu" }
lazalith-devices = { path = "../lazalith-devices" }
lazalith-isa = { path = "../lazalith-isa" }
lazalith-machine = { path = "../lazalith-machine" }
lazalith-memory = { path = "../lazalith-memory" }
lazalith-os = { path = "../lazalith-os" }
lazalith-toolchain = { path = "../lazalith-toolchain" }
# The cross-frontend differential links a C program against the C runtime's prelude
# to compare what it prints with what Lazen prints for the same program. Only the
# test needs either of these; nothing the library does, which is why they are
# dev-dependencies rather than dependencies.
lazalith-c-runtime = { path = "../lazalith-c-runtime" }
lazalith-runtime = { path = "../lazalith-runtime" }
