[package]
name = "lazalith-stdlib"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "The Lazen standard library, as Lazen source"
license = "MIT OR Apache-2.0"

# The library itself has no dependencies, deliberately.
#
# The standard library is *text*, and this crate exists to hold it. It does not
# need the runtime, the compiler or the OS: the text it exports is composed with
# the prelude by whoever builds a program, and that composition happens in
# `lazalith-runtime`. Depending on the runtime here would make the two crates
# depend on each other, because the runtime is what puts them together.
#
# The test dependencies are the opposite: a library that was only checked as text
# would be a library nobody has ever run.
[dev-dependencies]
lazalith-boot = { path = "../lazalith-boot" }
lazalith-devices = { path = "../lazalith-devices" }
lazalith-isa = { path = "../lazalith-isa" }
lazalith-os = { path = "../lazalith-os" }
lazalith-runtime = { path = "../lazalith-runtime" }
lazalith-types = { path = "../lazalith-types" }

[lints]
workspace = true
