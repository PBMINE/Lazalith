[package]
name = "lazalith-jit"
version.workspace = true
edition.workspace = true
publish.workspace = true

description = "A host-native just-in-time execution engine for LZA code"

# This is the second and last crate allowed to contain `unsafe`, after
# `lazalith-sdl3`. A JIT has to do two things no safe Rust can: put machine code
# somewhere executable, and call it.
#
# The rule is not relaxed globally. The workspace `forbid` is overridden here the
# same way it is overridden in the SDL3 boundary crate — by writing this section and
# saying so in review — so a future crate cannot opt in by accident.
[package.metadata.lazalith]
unsafe_boundary = true

[dependencies]
lazalith-cpu = { path = "../lazalith-cpu" }
lazalith-isa = { path = "../lazalith-isa" }
lazalith-memory = { path = "../lazalith-memory" }
lazalith-types = { path = "../lazalith-types" }

# `unsafe` is allowed here and nowhere else, except in `lazalith-sdl3`. The
# workspace's `forbid` is overridden rather than removed, so a future crate
# cannot opt in by accident without writing this section and saying so in review.
[lints.rust]
unsafe_code = "allow"
