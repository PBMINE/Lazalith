[workspace]
members = ["crates/lazalith-types", "crates/lazalith-diagnostics", "crates/lazalith-ir", "crates/lazalith-isa", "crates/lazalith-cpu", "crates/lazalith-memory", "crates/lazalith-devices", "crates/lazalith-machine", "crates/lazalith-boot", "crates/lazalith-os", "crates/lazalith-os-abi", "crates/lazalith-toolchain"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
